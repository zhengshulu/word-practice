<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial‑scale=1.0,user-scalable=no"/>
<title>字词错题本</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#edf7f2;color:#222;padding-bottom:80px}
.container{padding:20px;max-width:600px;margin:0 auto}
h2{font-size:22px;margin-bottom:8px}
.sub-title{color:#666;font-size:14px;margin-bottom:24px}
.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px}
.card-green{background:#32bc9c;color:#fff;border-radius:24px;padding:28px;margin-bottom:20px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;padding:8px 4px;box-shadow:0 -1px 6px #00000010}
.nav-item{flex:1;text-align:center;font-size:12px;color:#999;padding:6px 2px}
.nav-item.active{color:#32bc9c}
.page{display:none}
.page.active{display:block}
textarea{width:100%;min-height:110px;padding:12px;border:1px solid #ddeae3;border-radius:14px;font-size:15px;background:#fafdfb}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{padding:10px 16px;border:none;border-radius:12px;font-size:15px;cursor:pointer}
.btn-green{background:#32bc9c;color:#fff}
.btn-outline{border:1px solid #32bc9c;color:#32bc9c;background:#fff}
input[type="file"]{display:none}
.file-label{padding:10px 16px;border:1px solid #32bc9c;color:#32bc9c;background:#fff;border-radius:12px;cursor:pointer;font-size:15px;display:inline-block}
.tip{font-size:13px;color:#666;margin:8px 0}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-box{background:#fff;border-radius:16px;padding:20px}
.big-num{font-size:36px;font-weight:bold;margin:6px 0}
.word-item{padding:12px 0;border-bottom:1px solid #edf7f2;font-size:15px}
</style>
</head>
<body>

<div class="container">
<!-- 首页 -->
<div id="page-home" class="page active">
  <h2>你好呀 👋</h2>
  <div class="sub-title">9月1日，周三</div>
  <div class="card-green">
    <div style="font-size:18px;opacity:0.9">今日待复习</div>
    <div class="big-num" id="todayCount">0</div>
    <div style="opacity:0.85;margin-bottom:20px">今天没有复习任务，棒棒哒！</div>
    <button class="btn-green" onclick="switchPage('review')">前往复习</button>
  </div>
  <div class="stat-row">
    <div class="stat-box">
      <div style="color:#666">总收录词数</div>
      <div class="big-num" id="totalCount">0</div>
    </div>
    <div class="stat-box">
      <button class="btn-green" onclick="switchPage('input')">+ 快速录入</button>
      <div style="font-size:13px;color:#666;margin-top:6px">添加错别字</div>
    </div>
  </div>

  <!-- 复习模块放到首页下方 -->
  <div class="card">
    <h3>快速复习入口</h3>
    <div class="tip">点击按钮跳转到复习页面开始刷题</div>
    <button class="btn-green" onclick="switchPage('review')" style="width:100%;margin-top:8px">开始复习</button>
  </div>

  <div class="card" style="background:#e8f7f2">
    <div style="color:#209479;font-size:14px">💡 复习小贴士</div>
    <div style="margin-top:6px;font-size:14px;color:#333">按照艾宾浩斯记忆曲线安排复习，坚持 30 天就能牢牢记住字词啦！</div>
  </div>
</div>

<!-- 录入页 -->
<div id="page-input" class="page">
  <h2>录入新词</h2>
  <div class="card">
    <div class="tip">手动单条添加词语</div>
    <input placeholder="词语" id="inpWord" style="width:100%;padding:12px;border:1px solid #ddeae3;border-radius:12px;margin-bottom:10px;font-size:15px"/>
    <input placeholder="拼音" id="inpPinyin" style="width:100%;padding:12px;border:1px solid #ddeae3;border-radius:12px;margin-bottom:10px;font-size:15px"/>
    <textarea placeholder="容易写错的部分（可选）" id="inpWrong" style="min-height:70px"></textarea>
    <button class="btn-green" onclick="addSingleWord()" style="width:100%;margin-top:12px">保存词条</button>
  </div>
</div>

<!-- 复习页 -->
<div id="page-review" class="page">
  <h2>开始复习</h2>
  <div class="card">
    <div id="reviewTip">暂无待复习词条</div>
    <button class="btn-green" id="startReviewBtn" onclick="startReview()" style="width:100%;margin-top:12px">开始复习</button>
  </div>
</div>

<!-- 词库页【批量粘贴、Excel、JSON全部放在这里】 -->
<div id="page-wordlib" class="page">
  <h2>词库管理</h2>
  <div class="card">
    <h3>批量粘贴导入词语</h3>
    <div class="tip">一行一个词语，拼音后续手动补齐，重复词语自动跳过</div>
    <textarea id="batchText" placeholder="衣裳
拘束
稍微"></textarea>
    <button class="btn-green" onclick="batchAddWords()" style="margin-top:10px">批量添加</button>
  </div>

  <div class="card">
    <h3>备份导入导出</h3>
    <div class="btn-group">
      <button class="btn-outline" onclick="exportJson()">⬇️导出 JSON</button>
      <label class="file-label">⬆️导入 JSON
        <input type="file" accept=".json" id="inJson" />
      </label>
    </div>
    <div class="btn-group" style="margin-top:10px">
      <button class="btn-outline" onclick="exportExcel()">⬇️导出 Excel(.xlsx)</button>
      <label class="file-label">⬆️导入 Excel(.xlsx)
        <input type="file" accept=".xlsx,.xls" id="inExcel" />
      </label>
    </div>
  </div>

  <div class="card">
    <h3>词条预览（前20条）</h3>
    <div id="libPreview"></div>
  </div>
</div>

<!-- 统计页 -->
<div id="page-stat" class="page">
  <h2>学习统计</h2>
  <div class="card">
    <div>总词条：<span id="statTotal">0</span></div>
    <div>今日复习完成：<span id="statToday">0</span></div>
  </div>
</div>
</div>

<!--底部导航-->
<div class="bottom-nav">
  <div class="nav-item active" data-page="home">🏠<br>首页</div>
  <div class="nav-item" data-page="input">➕<br>录入</div>
  <div class="nav-item" data-page="review">📖<br>复习</div>
  <div class="nav-item" data-page="wordlib">📄<br>词库</div>
  <div class="nav-item" data-page="stat">📊<br>统计</div>
</div>

<script>
const STORAGE_KEY = "wordReviewData";
let wordList = [];

//页面切换
function switchPage(name){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page-"+name).classList.add("active");
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  document.querySelector(`.nav-item[data-page="${name}"]`).classList.add("active");
  refreshUI();
}
document.querySelectorAll(".nav-item").forEach(item=>{
  item.onclick = ()=>switchPage(item.dataset.page);
})

//加载保存
function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw) wordList = JSON.parse(raw);
  refreshUI();
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(wordList));
  refreshUI();
}
function refreshUI(){
  document.getElementById("totalCount").innerText = wordList.length;
  const today = getTodayStr();
  const needReview = wordList.filter(w=>new Date(w.nextReview) <= new Date());
  document.getElementById("todayCount").innerText = needReview.length;
  document.getElementById("statTotal").innerText = wordList.length;
  renderLibPreview();
}
function getTodayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${(d.getMonth()+1+"").padStart(2,"0")}-${(d.getDate()+"").padStart(2,"0")}`;
}

//单条录入
function addSingleWord(){
  const w = document.getElementById("inpWord").value.trim();
  const py = document.getElementById("inpPinyin").value.trim();
  const wrong = document.getElementById("inpWrong").value.trim();
  if(!w) return alert("请输入词语");
  if(wordList.some(x=>x.word===w)) return alert("该词语已存在");
  const now=new Date();
  const next=new Date(now.getTime()+24*3600*1000);
  wordList.push({
    word:w,pinyin:py,wrongText:wrong,errType:"其他",level:0,failCount:0,
    createTime:now.toISOString(),nextReview:next.toISOString()
  })
  saveData();
  document.getElementById("inpWord").value="";
  document.getElementById("inpPinyin").value="";
  document.getElementById("inpWrong").value="";
  alert("添加成功");
}

//批量粘贴新增
function batchAddWords(){
  const txt = document.getElementById("batchText").value.trim();
  if(!txt) return alert("请粘贴词语");
  const lines = txt.split("\n").map(s=>s.trim()).filter(s=>s);
  const now=new Date();
  let add=0;
  lines.forEach(w=>{
    if(wordList.some(x=>x.word===w)) return;
    const next=new Date(now.getTime()+24*3600*1000);
    wordList.push({
      word:w,pinyin:"",wrongText:"",errType:"其他",level:0,failCount:0,
      createTime:now.toISOString(),nextReview:next.toISOString()
    });
    add++;
  })
  saveData();
  document.getElementById("batchText").value="";
  alert(`完成，新增${add}条，重复已跳过`);
}

//预览词条
function renderLibPreview(){
  const pre = document.getElementById("libPreview");
  const show = wordList.slice(0,20);
  pre.innerHTML = show.map(x=>
    `<div class="word-item">${x.word}【${x.pinyin||"未填拼音"}】 level:${x.level}</div>`
  ).join("");
}

//JSON导出
function exportJson(){
  const blob = new Blob([JSON.stringify(wordList,null,2)],{type:"application/json"});
  downloadFile(blob,"words.json");
}
//JSON导入绑定
document.getElementById("inJson").onchange = readJsonFile;
function readJsonFile(e){
  const f = e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const arr=JSON.parse(ev.target.result);
      mergeList(arr);
    }catch{alert("JSON解析出错")}
  }
  r.readAsText(f);
}

//Excel导出
function exportExcel(){
  const data = wordList.map(x=>({
    word:x.word,pinyin:x.pinyin,wrongText:x.wrongText,errType:x.errType,
    level:x.level,failCount:x.failCount,createTime:x.createTime,nextReview:x.nextReview
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"词库");
  const buf = XLSX.write(wb,{bookType:"xlsx",type:"array"});
  const blob = new Blob([new Uint8Array(buf)]);
  downloadFile(blob,"字词错题本.xlsx");
}
//Excel导入
document.getElementById("inExcel").onchange = function(e){
  const f = e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const b = new Uint8Array(ev.target.result);
    const wb = XLSX.read(b,{type:"array"});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const arr = XLSX.utils.sheet_to_json(sheet);
    mergeList(arr);
  }
  r.readAsArrayBuffer(f);
}

//合并词条，同名跳过
function mergeList(newArr){
  let add=0;
  newArr.forEach(item=>{
    if(!item.word) return;
    if(wordList.some(x=>x.word===item.word)) return;
    wordList.push(item);
    add++;
  })
  saveData();
  alert(`导入完成，新增${add}条，重复词条已跳过`);
}

function downloadFile(blob,filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

//复习占位
function startReview(){
  alert("复习模块待扩展");
}

loadData();
</script>
</body>
</html>
